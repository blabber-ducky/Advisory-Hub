name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.13"

jobs:
  lint:
    name: Lint & type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -e ".[dev]"
      - name: ruff check
        run: ruff check advisory_hub tests migrations
      - name: ruff format
        run: ruff format --check advisory_hub tests migrations
      - name: mypy
        run: mypy advisory_hub
        env:
          SECRET_KEY: ci-placeholder-not-used-at-import

  test:
    name: Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: advisory_hub
          POSTGRES_PASSWORD: advisory_hub
          POSTGRES_DB: advisory_hub_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U advisory_hub"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      SECRET_KEY: ci-secret-key-not-a-placeholder-value
      ENVIRONMENT: test
      DATABASE_URL: postgresql+psycopg://advisory_hub:advisory_hub@localhost:5432/advisory_hub_test
      TEST_DATABASE_URL: postgresql+psycopg://advisory_hub:advisory_hub@localhost:5432/advisory_hub_test
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Run tests
        run: pytest -q
      - name: Migrations are reversible
        # A downgrade that doesn't work is a migration you can't roll back.
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
      - name: No un-migrated model changes
        # Fails if someone edited a model without generating a migration.
        run: |
          alembic revision --autogenerate -m "drift-check" --rev-id drift 2>/dev/null
          if grep -qE "op\.(create|drop|alter|add)_" migrations/versions/drift_drift_check.py; then
            echo "::error::Models have drifted from migrations. Generate one."
            cat migrations/versions/drift_drift_check.py
            exit 1
          fi
          rm -f migrations/versions/drift_drift_check.py

  images:
    name: Image — ${{ matrix.image }}
    # Pull requests build both images to prove they still build, but never
    # push (and fork PRs have no secrets anyway). Pushes to main and v* tags
    # publish, and only after lint + tests pass.
    needs: [lint, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # app + worker: same image, different command (docker-compose.yml).
          - image: advisory-hub
            dockerfile: docker/Dockerfile
          # TLS proxy for the HTTPS overlay, site config baked in.
          - image: advisory-hub-proxy
            dockerfile: docker/nginx/Dockerfile
    env:
      PUSH: ${{ github.event_name == 'push' }}
      # Docker Hub user/org to publish under. Set the repository variable
      # DOCKERHUB_NAMESPACE for an org; otherwise the login username is used.
      NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE || secrets.DOCKERHUB_USERNAME || 'localhost' }}
    steps:
      - uses: actions/checkout@v4

      - name: Check Docker Hub is configured
        if: env.PUSH == 'true'
        env:
          HAS_USER: ${{ secrets.DOCKERHUB_USERNAME != '' }}
          HAS_TOKEN: ${{ secrets.DOCKERHUB_TOKEN != '' }}
        run: |
          if [ "$HAS_USER" != "true" ] || [ "$HAS_TOKEN" != "true" ]; then
            echo "::error::Set the DOCKERHUB_USERNAME and DOCKERHUB_TOKEN repository secrets (docs/operations.md §8)."
            exit 1
          fi

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: env.PUSH == 'true'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: docker.io/${{ env.NAMESPACE }}/${{ matrix.image }}
          # main    → latest, main, sha-<7>
          # v1.4.0  → 1.4.0, 1.4, sha-<7>
          # PR      → pr-<n> (built, not pushed)
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,enable=${{ github.event_name == 'push' }}
            type=ref,event=pr
          labels: |
            org.opencontainers.image.title=${{ matrix.image }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          # amd64 for servers; arm64 so Apple-silicon test hosts can pull too.
          platforms: linux/amd64,linux/arm64
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
