<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title }} · Advisory Hub</title>
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>
  <style>
    :root {
      --bg: #f7f7f5; --surface: #fff; --border: #e3e2de; --ink: #1c1b19;
      --muted: #6b6a66; --accent: #7c5a3c; --danger: #a8332b;

      /* Status palette (dataviz skill) — fixed, never themed, never reused
         for series identity. Always paired with an icon/label, never color
         alone, per the skill's contrast findings on the light surface. */
      --status-good: #0ca30c;
      --status-good-bg: #e8f7e8;
      --status-warning: #b5790f;
      --status-warning-bg: #fdf1da;
      --status-serious: #c15a37;
      --status-serious-bg: #fbe9e1;
      --status-critical: #d03b3b;
      --status-critical-bg: #fbe4e4;
      --status-neutral: #6b6a66;
      --status-neutral-bg: #eeede9;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #17171a; --surface: #202024; --border: #33333a; --ink: #eceae5;
        --muted: #9d9b95; --accent: #c99a6b; --danger: #e0736a;

        --status-good: #35c235;
        --status-good-bg: #123214;
        --status-warning: #fab219;
        --status-warning-bg: #3a2c0c;
        --status-serious: #ec835a;
        --status-serious-bg: #3a2015;
        --status-critical: #e66767;
        --status-critical-bg: #3a1616;
        --status-neutral: #9d9b95;
        --status-neutral-bg: #2a2a2c;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100%; background: var(--bg); color: var(--ink);
      font: 15px/1.55 ui-sans-serif, -apple-system, "Segoe UI", system-ui, sans-serif;
    }
    header {
      display: flex; align-items: center; justify-content: space-between;
      padding: .75rem 1.25rem; border-bottom: 1px solid var(--border);
      background: var(--surface);
    }
    header .brand { font-weight: 650; letter-spacing: -.01em; }
    header .brand span { color: var(--accent); }
    header .left { display: flex; align-items: center; gap: 1.5rem; }
    nav.tabs { display: flex; gap: 1.1rem; }
    nav.tabs a {
      color: var(--muted); text-decoration: none; font-size: .88rem; font-weight: 550;
      padding: .2rem 0; border-bottom: 2px solid transparent;
    }
    nav.tabs a:hover { color: var(--ink); }
    nav.tabs a.active { color: var(--ink); border-bottom-color: var(--accent); }
    main { max-width: 1180px; margin: 0 auto; padding: 1.75rem 1.25rem; }
    .card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 10px; padding: 1.25rem;
    }
    .muted { color: var(--muted); }
    label { display: block; font-size: .85rem; font-weight: 550; margin-bottom: .3rem; }
    input[type=email], input[type=password] {
      width: 100%; padding: .55rem .7rem; border: 1px solid var(--border);
      border-radius: 7px; background: var(--bg); color: var(--ink); font-size: .95rem;
    }
    input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
    button {
      background: var(--accent); color: #fff; border: 0; border-radius: 7px;
      padding: .55rem 1rem; font-size: .95rem; font-weight: 550; cursor: pointer;
    }
    button:hover { filter: brightness(1.08); }
    button.link { background: none; color: var(--muted); padding: 0; font-weight: 400; }
    .error {
      background: color-mix(in srgb, var(--danger) 12%, transparent);
      border: 1px solid var(--danger); color: var(--danger);
      padding: .6rem .8rem; border-radius: 7px; font-size: .9rem; margin-bottom: 1rem;
    }
    .notice {
      border-left: 3px solid var(--accent); padding: .5rem 0 .5rem .9rem;
      margin: 1rem 0; color: var(--muted); font-size: .92rem;
    }
    code { font: .86em ui-monospace, "SF Mono", Menlo, monospace;
           background: var(--bg); padding: .1em .35em; border-radius: 4px; }

    /* ─── Stat tiles ─────────────────────────────────────────────────── */
    .stat-grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: .75rem; margin-bottom: 1.5rem;
    }
    .stat-tile {
      background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
      padding: .9rem 1rem; display: flex; flex-direction: column; gap: .3rem;
      text-decoration: none; color: inherit; transition: border-color .12s;
    }
    a.stat-tile:hover { border-color: var(--accent); }
    .stat-tile .value { font-size: 1.7rem; font-weight: 650; line-height: 1; letter-spacing: -.02em; }
    .stat-tile .label { font-size: .8rem; color: var(--muted); }
    .stat-tile.tone-critical .value { color: var(--status-critical); }
    .stat-tile.tone-warning .value { color: var(--status-warning); }
    .stat-tile.tone-good .value { color: var(--status-good); }

    /* ─── Status / severity badges — icon + label, never color alone ──── */
    .badge {
      display: inline-flex; align-items: center; gap: .35em;
      font-size: .78rem; font-weight: 600; padding: .16em .55em .16em .5em;
      border-radius: 999px; white-space: nowrap; line-height: 1.5;
    }
    .badge::before { content: ""; width: .5em; height: .5em; border-radius: 50%; flex: none; }
    .badge-critical { color: var(--status-critical); background: var(--status-critical-bg); }
    .badge-critical::before { background: var(--status-critical); }
    .badge-serious  { color: var(--status-serious);  background: var(--status-serious-bg); }
    .badge-serious::before  { background: var(--status-serious); }
    .badge-warning  { color: var(--status-warning);  background: var(--status-warning-bg); }
    .badge-warning::before  { background: var(--status-warning); }
    .badge-good     { color: var(--status-good);     background: var(--status-good-bg); }
    .badge-good::before     { background: var(--status-good); }
    .badge-neutral  { color: var(--status-neutral);  background: var(--status-neutral-bg); }
    .badge-neutral::before  { background: var(--status-neutral); }

    /* ─── Filter bar ─────────────────────────────────────────────────── */
    .filter-bar {
      display: flex; flex-wrap: wrap; gap: .5rem; align-items: center;
      margin-bottom: 1rem; padding: .6rem .7rem; background: var(--surface);
      border: 1px solid var(--border); border-radius: 10px;
    }
    .filter-bar select, .filter-bar input[type=search] {
      padding: .4rem .55rem; border: 1px solid var(--border); border-radius: 6px;
      background: var(--bg); color: var(--ink); font-size: .85rem;
    }
    .filter-bar input[type=search] { flex: 1; min-width: 10rem; }
    .filter-bar .clear-link { font-size: .82rem; color: var(--muted); text-decoration: none; }
    .filter-bar .clear-link:hover { text-decoration: underline; }

    /* ─── Tracker table ──────────────────────────────────────────────── */
    table.tracker { width: 100%; border-collapse: collapse; font-size: .88rem; }
    table.tracker th {
      text-align: left; font-size: .74rem; text-transform: uppercase; letter-spacing: .03em;
      color: var(--muted); font-weight: 600; padding: .5rem .6rem; border-bottom: 1px solid var(--border);
    }
    table.tracker td { padding: .55rem .6rem; border-bottom: 1px solid var(--border); vertical-align: top; }
    table.tracker tbody tr { cursor: pointer; }
    table.tracker tbody tr:hover td { background: color-mix(in srgb, var(--accent) 5%, transparent); }
    .col-title { max-width: 26rem; }
    .col-title .ref {
      font-family: ui-monospace, monospace; font-size: .78rem; color: var(--muted);
      text-decoration: none;
    }
    .col-title .ref:hover { text-decoration: underline; }
    .col-title .title { display: block; font-weight: 550; }
    .row-flags { display: inline-flex; gap: .25rem; margin-left: .4rem; vertical-align: middle; }
    .flag-dot {
      width: .55rem; height: .55rem; border-radius: 50%; display: inline-block;
      background: var(--status-warning); cursor: help;
    }
    .last-comment { color: var(--muted); font-size: .82rem; max-width: 20rem;
                     overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .pagination { display: flex; justify-content: space-between; align-items: center;
                  margin-top: .9rem; font-size: .85rem; color: var(--muted); }
    .pagination a { color: var(--accent); text-decoration: none; }
    .pagination a:hover { text-decoration: underline; }
    .pagination .disabled { color: var(--border); pointer-events: none; }
    .empty-state { text-align: center; padding: 3rem 1rem; color: var(--muted); }

    /* ─── Detail panel ───────────────────────────────────────────────── */
    .detail-panel { padding: 1rem 1.2rem 1.4rem; }
    .detail-grid { display: grid; grid-template-columns: 2fr 1fr; gap: 1.5rem; align-items: start; }
    @media (max-width: 900px) { .detail-grid { grid-template-columns: 1fr; } }
    .detail-section { margin-bottom: 1.2rem; }
    .detail-section h3 {
      font-size: .78rem; text-transform: uppercase; letter-spacing: .03em; color: var(--muted);
      margin: 0 0 .5rem;
    }
    .kv { display: grid; grid-template-columns: auto 1fr; gap: .3rem 1rem; font-size: .87rem; }
    .kv dt { color: var(--muted); }
    .kv dd { margin: 0; }
    .chip-list { display: flex; flex-wrap: wrap; gap: .35rem; }
    .chip {
      font-family: ui-monospace, monospace; font-size: .78rem; padding: .18em .5em;
      background: var(--bg); border: 1px solid var(--border); border-radius: 5px;
    }
    /* IOC-type chips sit inline next to a badge, so they drop the monospace
       face and shrink to read as a secondary annotation, not a value. */
    .ioc-summary { display: inline-flex; flex-wrap: wrap; gap: .25rem; align-items: center;
      margin-left: .35rem; vertical-align: middle; }
    .chip-ioc {
      font-family: inherit; font-size: .7rem; font-weight: 600; padding: .1em .45em;
      color: var(--muted); background: transparent; cursor: help;
    }
    .ioc-table, .product-table { width: 100%; border-collapse: collapse; font-size: .82rem; }
    .ioc-table th, .product-table th { text-align: left; color: var(--muted); font-weight: 600;
      padding: .3rem .5rem; border-bottom: 1px solid var(--border); }
    .ioc-table td, .product-table td { padding: .3rem .5rem; border-bottom: 1px solid var(--border); }
    .ioc-value { font-family: ui-monospace, monospace; font-size: .8rem; }
    .comment-list { display: flex; flex-direction: column; gap: .6rem; max-height: 22rem; overflow-y: auto; }
    .comment { border-left: 2px solid var(--border); padding: .3rem .7rem; }
    .comment .meta { font-size: .76rem; color: var(--muted); margin-bottom: .15rem; }
    .comment .body { font-size: .87rem; white-space: pre-wrap; }
    .attachment-list { display: flex; flex-direction: column; gap: .35rem; }
    .attachment-list a { font-size: .85rem; color: var(--accent); text-decoration: none; }
    .attachment-list a:hover { text-decoration: underline; }
    .sla-line { display: flex; align-items: baseline; gap: .4rem; font-size: .85rem; margin-bottom: .3rem; }
    .sla-line .label { color: var(--muted); min-width: 6rem; }
    .status-form { margin-top: .8rem; display: flex; flex-direction: column; gap: .6rem; }
    .status-form select, .status-form textarea {
      width: 100%; padding: .5rem .6rem; border: 1px solid var(--border);
      border-radius: 7px; background: var(--bg); color: var(--ink); font-size: .88rem;
      font-family: inherit;
    }
    .status-form textarea { resize: vertical; }
    .status-form button { align-self: flex-start; }
    .htmx-indicator { display: none; }
    .htmx-request .htmx-indicator { display: inline; }
    .htmx-request.htmx-indicator { display: inline; }
  </style>
</head>
<body>
{% if principal %}
<header>
  <div class="left">
    <div class="brand">Advisory<span>Hub</span></div>
    <nav class="tabs">
      <a href="/" class="{{ 'active' if active_nav == 'tracker' else '' }}">Tracker</a>
      <a href="/inventory" class="{{ 'active' if active_nav == 'inventory' else '' }}">Inventory</a>
      <a href="/affected-software" class="{{ 'active' if active_nav == 'affected_software' else '' }}">Affected Software</a>
      <a href="/iocs" class="{{ 'active' if active_nav == 'iocs' else '' }}">IOCs</a>
      {% if principal.user and principal.user.role.value == 'ADMIN' %}
      <a href="/admin" class="{{ 'active' if active_nav == 'admin' else '' }}">Admin</a>
      {% endif %}
    </nav>
  </div>
  <div class="muted" style="display:flex;gap:1rem;align-items:center">
    <span>{{ principal.display }} · {{ principal.role }}</span>
    <form method="post" action="/logout" style="margin:0">
      <button class="link" type="submit">Sign out</button>
    </form>
  </div>
</header>
{% endif %}
<main>{% block content %}{% endblock %}</main>
</body>
</html>
