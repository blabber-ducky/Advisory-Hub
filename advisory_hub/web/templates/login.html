{% extends "base.html" %}
{% block content %}
<div style="max-width: 24rem; margin: 3rem auto">
  <h1 style="font-size:1.4rem;margin:0 0 .35rem">Advisory Hub</h1>
  <p class="muted" style="margin:0 0 1.5rem">Security advisory tracking &amp; remediation</p>

  <div class="card">
    {% if error %}<div class="error" role="alert">{{ error }}</div>{% endif %}
    {% if sso_enabled %}
    <a class="sso-button" href="/auth/entra/login">
      <svg width="16" height="16" viewBox="0 0 21 21" aria-hidden="true"><rect x="1" y="1" width="9" height="9" fill="#f25022"/><rect x="11" y="1" width="9" height="9" fill="#7fba00"/><rect x="1" y="11" width="9" height="9" fill="#00a4ef"/><rect x="11" y="11" width="9" height="9" fill="#ffb900"/></svg>
      Sign in with Microsoft
    </a>
    <div class="or-divider"><span>or with a local account</span></div>
    {% endif %}
    <form method="post" action="/login">
      <div style="margin-bottom:.9rem">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" value="{{ email or '' }}"
               required autofocus autocomplete="username">
      </div>
      <div style="margin-bottom:1.2rem">
        <label for="password">Password</label>
        <input type="password" id="password" name="password"
               required autocomplete="current-password">
      </div>
      <button type="submit" style="width:100%">Sign in</button>
    </form>
  </div>
</div>
{% endblock %}
