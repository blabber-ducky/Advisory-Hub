{% extends "base.html" %}
{% block content %}
<div style="max-width: 24rem; margin: 3rem auto">
  <h1 style="font-size:1.4rem;margin:0 0 .35rem">Advisory Hub</h1>
  <p class="muted" style="margin:0 0 1.5rem">Security advisory tracking &amp; remediation</p>

  <div class="card">
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    <form method="post" action="/login">
      <div style="margin-bottom:.9rem">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" value="{{ email or '' }}"
               required autofocus autocomplete="username">
      </div>
      <div style="margin-bottom:1.2rem">
        <label for="password">Password</label>
        <input type="password" id="password" name="password"
               required autocomplete="current-password">
      </div>
      <button type="submit" style="width:100%">Sign in</button>
    </form>
  </div>
</div>
{% endblock %}
