# Advisory Hub — production stack, no bundled TLS proxy. Self-contained: use
# this file on its own, in place of docker-compose.prod.yml, when TLS is
# terminated upstream by an enterprise WAF or reverse proxy (F5, Citrix ADC,
# Imperva, Azure Application Gateway, Cloudflare Enterprise, ...) instead of
# the bundled nginx container.
#
#   cp .env.production.no-proxy.example .env    # fill in every CHANGE_ME
#   docker compose pull && docker compose up -d
#
# .env sets COMPOSE_FILE=docker-compose.prod.no-proxy.yml, so plain
# `docker compose` uses this file. Full walkthrough: docs/deployment.md §1b.
#
# Identical to docker-compose.prod.yml except:
#   - No `proxy` service, no `advisory-hub-proxy` image. `app` publishes its
#     own port (APP_PORT, default 8000) directly instead.
#   - TLS, HSTS, and the HTTP→HTTPS redirect are your WAF/proxy's job, not
#     this stack's. scripts/https-setup.sh does not apply here.
#   - FORWARDED_ALLOW_IPS is NOT "*". With the bundled proxy, trusting every
#     peer's X-Forwarded-* headers is safe only because nothing but that one
#     sidecar container can reach `app`. Here `app`'s port is reachable by
#     whatever your firewall/network lets through, so TRUSTED_PROXY_IPS must
#     name the WAF/proxy's real address(es) — anyone else who can reach the
#     port could otherwise spoof X-Forwarded-For/-Proto and poison the audit
#     log or fake an HTTPS connection. See D-040.
#
# Operator responsibilities this file cannot enforce:
#   - Firewall `APP_PORT` so only the WAF/proxy can reach it — never expose
#     it directly to the wider network or the internet.
#   - The WAF/proxy must forward Host, X-Forwarded-For, and X-Forwarded-Proto
#     unmodified, and must itself terminate TLS (app only ever speaks plain
#     HTTP — there is no TLS listener in this stack at all).

name: advisory-hub

x-logging: &logging
  logging:
    driver: json-file
    options:
      max-size: "20m"
      max-file: "5"

x-hardening: &hardening
  security_opt:
    - no-new-privileges:true

# Everything in .env is passed through (VT_*, PDF_*, CSV_*, poll intervals…);
# `environment` below then pins what must not be overridden from .env.
x-app: &app
  image: ${IMAGE_NAMESPACE:?set IMAGE_NAMESPACE in .env}/advisory-hub:${IMAGE_TAG:?pin IMAGE_TAG in .env (e.g. 1.4.0 or sha-1a2b3c4)}
  env_file: [.env]
  environment: &app-env
    DATABASE_URL: postgresql+psycopg://advisory_hub:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/advisory_hub
    REDIS_URL: redis://redis:6379/0
    SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env}
    FERNET_KEY: ${FERNET_KEY:?set FERNET_KEY in .env — losing it means re-entering every credential}
    ENVIRONMENT: production
    LOG_FORMAT: json
    SESSION_COOKIE_SECURE: "true"
    BLOB_ROOT: /data/blobs
    INBOX_PATH: /data/inbox
    PROCESSING_PATH: /data/processing
    ARCHIVE_PATH: /data/archive
    FAILED_PATH: /data/failed
  volumes:
    - blobs:/data/blobs
    - ${INBOX_HOST_PATH:-inbox}:/data/inbox
    - processing:/data/processing
    - archive:/data/archive
    - failed:/data/failed
  read_only: true
  tmpfs:
    # PDF extraction and reparse use a temp dir; PDFs are capped at 50 MB.
    - /tmp:size=512m,mode=1777
  cap_drop: [ALL]
  <<: [*hardening, *logging]
  restart: unless-stopped

services:
  app:
    <<: *app
    # --proxy-headers + FORWARDED_ALLOW_IPS: trust X-Forwarded-* only from
    # your WAF/proxy's own address(es) — never "*" here, since this port is
    # reachable by more than one trusted sidecar. See the file header.
    command:
      - uvicorn
      - advisory_hub.main:app
      - --host=0.0.0.0
      - --port=8000
      - --proxy-headers
      - --no-server-header
      - --workers=${WEB_CONCURRENCY:-1}
    environment:
      <<: *app-env
      FORWARDED_ALLOW_IPS: ${TRUSTED_PROXY_IPS:?set TRUSTED_PROXY_IPS in .env to your WAF/reverse proxy's address(es) — comma-separated IPs, not a CIDR; see docs/deployment.md §1b}
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${APP_PORT:-8000}:8000"
    networks: [frontend, backend]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    deploy:
      resources:
        limits: {cpus: "2", memory: 1g}

  worker:
    <<: *app
    command: ["python", "-m", "advisory_hub.worker"]
    # The image's HEALTHCHECK probes the web port, which the worker doesn't
    # serve. Check what the worker actually depends on instead.
    healthcheck:
      test: ["CMD", "python", "-m", "advisory_hub.cli", "check"]
      interval: 60s
      timeout: 20s
      start_period: 30s
      retries: 3
    init: true
    stop_grace_period: 60s
    # backend for Postgres/Redis; egress for NVD, VirusTotal and inventory APIs.
    networks: [backend, egress]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    deploy:
      resources:
        limits: {cpus: "2", memory: 2g}

  # One-shot: applies migrations, then exits. app and worker wait for it.
  migrate:
    <<: *app
    command: ["alembic", "upgrade", "head"]
    healthcheck: {disable: true}
    networks: [backend]
    depends_on:
      postgres: {condition: service_healthy}
    restart: "no"

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: advisory_hub
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: advisory_hub
    volumes:
      - pgdata:/var/lib/postgresql/data
    shm_size: 256m
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U advisory_hub -d advisory_hub"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits: {cpus: "2", memory: 2g}
    <<: [*hardening, *logging]
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    # Job queue, not a cache: never evict, persist to disk.
    command: ["redis-server", "--save", "60", "1", "--appendonly", "yes", "--maxmemory-policy", "noeviction", "--loglevel", "warning"]
    volumes:
      - redisdata:/data
    networks: [backend]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits: {cpus: "1", memory: 512m}
    <<: [*hardening, *logging]
    restart: unless-stopped

networks:
  # app's published port and its own outbound calls (interactive VirusTotal
  # checks, inventory "Test connection"). Not internal.
  frontend:
  # Postgres/Redis and their clients. internal: no route to the outside.
  backend:
    internal: true
  # Worker's outbound access (NVD, VirusTotal, inventory APIs).
  egress:

volumes:
  pgdata:
  redisdata:
  blobs:
  inbox:
  processing:
  archive:
  failed:
