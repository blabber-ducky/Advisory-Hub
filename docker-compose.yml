name: advisory-hub

# Base / development stack. For production use docker-compose.prod.yml
# instead (docs/deployment.md).

x-app-env: &app-env
  DATABASE_URL: postgresql+psycopg://advisory_hub:${POSTGRES_PASSWORD:-advisory_hub_dev}@postgres:5432/advisory_hub
  REDIS_URL: redis://redis:6379/0
  SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set — see .env.example}
  BLOB_ROOT: /data/blobs
  INBOX_PATH: /data/inbox
  PROCESSING_PATH: /data/processing
  ARCHIVE_PATH: /data/archive
  FAILED_PATH: /data/failed
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  LOG_FORMAT: ${LOG_FORMAT:-json}
  ENVIRONMENT: ${ENVIRONMENT:-production}
  SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-true}
  NVD_ENABLED: ${NVD_ENABLED:-true}
  NVD_API_KEY: ${NVD_API_KEY:-}
  FERNET_KEY: ${FERNET_KEY:-}
  OUTBOUND_ALLOWLIST: ${OUTBOUND_ALLOWLIST:-}

# app and worker run the same image (different command), pulled from
# Docker Hub. Built and pushed by CI (.github/workflows/ci.yml).
#
#   IMAGE_NAMESPACE  Docker Hub user/org the images are published under.
#                    Unset → "localhost/…", which only exists if built on
#                    this machine; a pull then fails loudly rather than
#                    fetching an image from someone else's namespace.
#   IMAGE_TAG        Pin to a release (e.g. 1.4.0) or sha-<commit> in
#                    production. Default: latest.
#
# docker-compose.override.yml (development) builds locally instead.
x-app-image: &app-image
  image: ${IMAGE_NAMESPACE:-localhost}/advisory-hub:${IMAGE_TAG:-latest}
  # Pass every .env setting through (VT_API_KEY, PDF_*, CSV_*, poll
  # intervals, …); `environment` still wins for the keys it sets.
  env_file:
    - path: .env
      required: false

# All persistent data lives in host folders under ./data/<volume> — not in
# Docker named volumes — so backup and restore are plain file operations on
# one directory (docs/operations.md §4):
#
#   ./data/pgdata      PostgreSQL           ./data/archive     ingested originals
#   ./data/redisdata   Redis (job queue)    ./data/failed      failed ingests
#   ./data/blobs       content store        ./data/inbox       watched inbox
#   ./data/processing  claim area           (unless INBOX_HOST_PATH is set)
x-app-volumes: &app-volumes
  - ./data/blobs:/data/blobs
  - ${INBOX_HOST_PATH:-./data/inbox}:/data/inbox
  - ./data/processing:/data/processing
  - ./data/archive:/data/archive
  - ./data/failed:/data/failed

services:
  # One-shot, before app/worker: creates the ./data folders and hands the
  # app's ones to the image's non-root user (uid 10001). Without it, Docker
  # on Linux creates a missing bind-mount folder owned by root and the app
  # can't write its blobs or claim inbox files. Also repairs ownership after
  # a restore copied files back as root. Postgres and Redis fix their own
  # folders in their entrypoints, so they're only created here.
  init-data:
    <<: *app-image
    user: "0:0"
    entrypoint: ["sh", "-c"]
    command:
      - >-
        set -e;
        for d in pgdata redisdata blobs inbox processing archive failed; do mkdir -p "/srv/data/$$d"; done;
        for d in blobs inbox processing archive failed; do
        find "/srv/data/$$d" ! -user 10001 -exec chown 10001:10001 {} +; done
    volumes:
      - ./data:/srv/data
    healthcheck: {disable: true}
    network_mode: none
    restart: "no"

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: advisory_hub
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-advisory_hub_dev}
      POSTGRES_DB: advisory_hub
    volumes:
      - ./data/pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U advisory_hub -d advisory_hub"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    volumes:
      - ./data/redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  app:
    <<: *app-image
    environment: *app-env
    ports:
      - "${APP_PORT:-8080}:8000"
    # INBOX_HOST_PATH points the watched inbox at another host folder (e.g.
    # where Power Automate / a mail rule drops emails) instead of
    # ./data/inbox — an absolute path in .env, e.g.
    # INBOX_HOST_PATH=/srv/advisory-hub/inbox. uid 10001 must be able to
    # write it; init-data only manages ./data.
    volumes: *app-volumes
    depends_on:
      init-data: {condition: service_completed_successfully}
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    restart: unless-stopped

  worker:
    <<: *app-image
    environment: *app-env
    command: ["python", "-m", "advisory_hub.worker"]
    # The image's HEALTHCHECK probes the web port, which the worker doesn't
    # serve — check what the worker actually depends on instead.
    healthcheck:
      test: ["CMD", "python", "-m", "advisory_hub.cli", "check"]
      interval: 60s
      timeout: 20s
      start_period: 30s
      retries: 3
    volumes: *app-volumes
    depends_on:
      init-data: {condition: service_completed_successfully}
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    restart: unless-stopped

