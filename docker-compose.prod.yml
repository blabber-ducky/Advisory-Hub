# Advisory Hub — production stack. Self-contained: use this file on its own.
#
#   cp .env.production.example .env        # fill in every CHANGE_ME
#   docker compose pull && docker compose up -d
#
# .env sets COMPOSE_FILE=docker-compose.prod.yml, so plain `docker compose`
# uses this file. Full walkthrough: docs/deployment.md.
#
# This stack speaks plain HTTP only. TLS, HSTS and the HTTP→HTTPS redirect
# belong to the enterprise WAF / reverse proxy in front of it (F5, Citrix
# ADC, Imperva, Azure Application Gateway, …), which is outside this stack.
#
# What makes it production-shaped, compared with docker-compose.yml:
#   - Pulls pinned, CI-published images; never builds. IMAGE_NAMESPACE and
#     IMAGE_TAG are required — there is no "latest" default here.
#   - Only `app` is published. Postgres and Redis sit on an internal
#     network with no route out.
#   - Forwarded headers are trusted ONLY from TRUSTED_PROXY_IPS — never "*".
#     `app`'s port is reachable by whatever your firewall lets through, so
#     trusting every peer would let anyone who can reach it spoof
#     X-Forwarded-For/-Proto and poison the audit log. See D-040.
#   - Migrations run once, as their own container, before app/worker start.
#   - All data in host folders under ./data/<volume> (made and owned by the
#     one-shot init-data container) — backup is a copy of one directory.
#   - Every required secret must be set; nothing falls back to a dev value.
#   - app/worker: read-only root filesystem, all capabilities dropped,
#     no-new-privileges, memory/CPU limits, bounded log files.
#
# Operator responsibilities this file cannot enforce:
#   - Firewall APP_PORT so only the WAF/reverse proxy can reach it — never
#     expose it directly to the wider network or the internet.
#   - The WAF/proxy must terminate TLS and forward Host, X-Forwarded-For and
#     X-Forwarded-Proto unmodified.

name: advisory-hub

x-logging: &logging
  logging:
    driver: json-file
    options:
      max-size: "20m"
      max-file: "5"

x-hardening: &hardening
  security_opt:
    - no-new-privileges:true

# Everything in .env is passed through (VT_*, PDF_*, CSV_*, poll intervals…);
# `environment` below then pins what must not be overridden from .env.
x-app: &app
  image: ${IMAGE_NAMESPACE:?set IMAGE_NAMESPACE in .env}/advisory-hub:${IMAGE_TAG:?pin IMAGE_TAG in .env (e.g. 1.4.0 or sha-1a2b3c4)}
  env_file: [.env]
  environment: &app-env
    DATABASE_URL: postgresql+psycopg://advisory_hub:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/advisory_hub
    REDIS_URL: redis://redis:6379/0
    SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env}
    FERNET_KEY: ${FERNET_KEY:?set FERNET_KEY in .env — losing it means re-entering every credential}
    ENVIRONMENT: production
    LOG_FORMAT: json
    SESSION_COOKIE_SECURE: "true"
    BLOB_ROOT: /data/blobs
    INBOX_PATH: /data/inbox
    PROCESSING_PATH: /data/processing
    ARCHIVE_PATH: /data/archive
    FAILED_PATH: /data/failed
  # Persistent data is in host folders under ./data/<volume>, not Docker
  # named volumes, so backup/restore is a file copy of one directory
  # (docs/operations.md §4). INBOX_HOST_PATH can point the inbox elsewhere.
  volumes:
    - ./data/blobs:/data/blobs
    - ${INBOX_HOST_PATH:-./data/inbox}:/data/inbox
    - ./data/processing:/data/processing
    - ./data/archive:/data/archive
    - ./data/failed:/data/failed
    - ./data/exports:/data/exports  # daily status-export CSVs
  read_only: true
  tmpfs:
    # PDF extraction and reparse use a temp dir; PDFs are capped at 50 MB.
    - /tmp:size=512m,mode=1777
  cap_drop: [ALL]
  <<: [*hardening, *logging]
  restart: unless-stopped

services:
  # One-shot, first: creates ./data/<volume> and hands the app's folders to
  # the image's non-root user (uid 10001) — Docker would otherwise create a
  # missing bind-mount folder owned by root, and the app couldn't write to
  # it. Also repairs ownership after a restore. Runs as root, but with only
  # the file-ownership capabilities it needs and no network.
  init-data:
    image: ${IMAGE_NAMESPACE:?set IMAGE_NAMESPACE in .env}/advisory-hub:${IMAGE_TAG:?pin IMAGE_TAG in .env (e.g. 1.4.0 or sha-1a2b3c4)}
    user: "0:0"
    entrypoint: ["sh", "-c"]
    command:
      - >-
        set -e;
        for d in pgdata redisdata blobs inbox processing archive failed exports; do mkdir -p "/srv/data/$$d"; done;
        for d in blobs inbox processing archive failed exports; do
        find "/srv/data/$$d" ! -user 10001 -exec chown 10001:10001 {} +; done
    volumes:
      - ./data:/srv/data
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER]
    network_mode: none
    healthcheck: {disable: true}
    <<: [*hardening, *logging]
    restart: "no"

  app:
    <<: *app
    # --proxy-headers + FORWARDED_ALLOW_IPS: trust X-Forwarded-* only from
    # your WAF/proxy's own address(es) — never "*", since this port is
    # reachable by whatever the firewall allows. See the file header.
    command:
      - uvicorn
      - advisory_hub.main:app
      - --host=0.0.0.0
      - --port=8000
      - --proxy-headers
      - --no-server-header
      - --workers=${WEB_CONCURRENCY:-1}
    environment:
      <<: *app-env
      FORWARDED_ALLOW_IPS: ${TRUSTED_PROXY_IPS:?set TRUSTED_PROXY_IPS in .env to your WAF/reverse proxy's address(es) — comma-separated IPs, not a CIDR; see docs/deployment.md}
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${APP_PORT:-8000}:8000"
    networks: [frontend, backend]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    deploy:
      resources:
        limits: {cpus: "2", memory: 1g}

  worker:
    <<: *app
    command: ["python", "-m", "advisory_hub.worker"]
    # The image's HEALTHCHECK probes the web port, which the worker doesn't
    # serve. Check what the worker actually depends on instead.
    healthcheck:
      test: ["CMD", "python", "-m", "advisory_hub.cli", "check"]
      interval: 60s
      timeout: 20s
      start_period: 30s
      retries: 3
    init: true
    stop_grace_period: 60s
    # backend for Postgres/Redis; egress for NVD, VirusTotal and inventory APIs.
    networks: [backend, egress]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    deploy:
      resources:
        limits: {cpus: "2", memory: 2g}

  # One-shot: applies migrations, then exits. app and worker wait for it.
  migrate:
    <<: *app
    command: ["alembic", "upgrade", "head"]
    healthcheck: {disable: true}
    networks: [backend]
    depends_on:
      init-data: {condition: service_completed_successfully}
      postgres: {condition: service_healthy}
    restart: "no"

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: advisory_hub
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: advisory_hub
    volumes:
      - ./data/pgdata:/var/lib/postgresql/data
    shm_size: 256m
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U advisory_hub -d advisory_hub"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits: {cpus: "2", memory: 2g}
    <<: [*hardening, *logging]
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    # Job queue, not a cache: never evict, persist to disk.
    command: ["redis-server", "--save", "60", "1", "--appendonly", "yes", "--maxmemory-policy", "noeviction", "--loglevel", "warning"]
    volumes:
      - ./data/redisdata:/data
    networks: [backend]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits: {cpus: "1", memory: 512m}
    <<: [*hardening, *logging]
    restart: unless-stopped

networks:
  # app's published port and its own outbound calls (interactive VirusTotal
  # checks, inventory "Test connection"). Not internal.
  frontend:
  # Postgres/Redis and their clients. internal: no route to the outside.
  backend:
    internal: true
  # Worker's outbound access (NVD, VirusTotal, inventory APIs).
  egress:

