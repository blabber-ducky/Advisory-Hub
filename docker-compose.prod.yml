# Advisory Hub — production stack. Self-contained: use this file on its own.
#
#   cp .env.production.example .env        # fill in every CHANGE_ME
#   scripts/https-setup.sh install ...     # certificate (docs/operations.md §7)
#   docker compose pull && docker compose up -d
#
# .env sets COMPOSE_FILE=docker-compose.prod.yml, so plain `docker compose`
# uses this file. Full walkthrough: docs/deployment.md.
#
# What makes it production-shaped, compared with docker-compose.yml:
#   - Pulls pinned, CI-published images; never builds. IMAGE_NAMESPACE and
#     IMAGE_TAG are required — there is no "latest" default here.
#   - HTTPS only. The TLS proxy is the sole published service; app,
#     Postgres and Redis have no host ports.
#   - Postgres and Redis sit on an internal network with no route out.
#   - Migrations run once, as their own container, before app/worker start.
#   - Every required secret must be set; nothing falls back to a dev value.
#   - app/worker: read-only root filesystem, all capabilities dropped,
#     no-new-privileges, memory/CPU limits, bounded log files.

name: advisory-hub

x-logging: &logging
  logging:
    driver: json-file
    options:
      max-size: "20m"
      max-file: "5"

x-hardening: &hardening
  security_opt:
    - no-new-privileges:true

# Everything in .env is passed through (VT_*, PDF_*, CSV_*, poll intervals…);
# `environment` below then pins what must not be overridden from .env.
x-app: &app
  image: ${IMAGE_NAMESPACE:?set IMAGE_NAMESPACE in .env}/advisory-hub:${IMAGE_TAG:?pin IMAGE_TAG in .env (e.g. 1.4.0 or sha-1a2b3c4)}
  env_file: [.env]
  environment: &app-env
    DATABASE_URL: postgresql+psycopg://advisory_hub:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/advisory_hub
    REDIS_URL: redis://redis:6379/0
    SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env}
    FERNET_KEY: ${FERNET_KEY:?set FERNET_KEY in .env — losing it means re-entering every credential}
    ENVIRONMENT: production
    LOG_FORMAT: json
    SESSION_COOKIE_SECURE: "true"
    BLOB_ROOT: /data/blobs
    INBOX_PATH: /data/inbox
    PROCESSING_PATH: /data/processing
    ARCHIVE_PATH: /data/archive
    FAILED_PATH: /data/failed
  volumes:
    - blobs:/data/blobs
    - ${INBOX_HOST_PATH:-inbox}:/data/inbox
    - processing:/data/processing
    - archive:/data/archive
    - failed:/data/failed
  read_only: true
  tmpfs:
    # PDF extraction and reparse use a temp dir; PDFs are capped at 50 MB.
    - /tmp:size=512m,mode=1777
  cap_drop: [ALL]
  <<: [*hardening, *logging]
  restart: unless-stopped

services:
  proxy:
    image: ${IMAGE_NAMESPACE}/advisory-hub-proxy:${IMAGE_TAG}
    environment:
      SERVER_NAME: ${SERVER_NAME:?set SERVER_NAME in .env — run scripts/https-setup.sh}
      HSTS_MAX_AGE: ${HSTS_MAX_AGE:-31536000}
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${HTTP_PORT:-80}:80"
      - "${BIND_ADDRESS:-0.0.0.0}:${HTTPS_PORT:-443}:443"
    volumes:
      - ${TLS_CERT_DIR:-./certs}:/etc/nginx/certs:ro
    networks: [edge]
    depends_on:
      app: {condition: service_healthy}
    deploy:
      resources:
        limits: {cpus: "1", memory: 256m}
    <<: [*hardening, *logging]
    restart: unless-stopped

  app:
    <<: *app
    # --proxy-headers + FORWARDED_ALLOW_IPS: trust X-Forwarded-* from the
    # proxy so the audit log records real client IPs. Safe only because app
    # has no published port — nothing but the proxy can reach it.
    command:
      - uvicorn
      - advisory_hub.main:app
      - --host=0.0.0.0
      - --port=8000
      - --proxy-headers
      - --no-server-header
      - --workers=${WEB_CONCURRENCY:-1}
    environment:
      <<: *app-env
      FORWARDED_ALLOW_IPS: "*"
    networks: [edge, backend]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    deploy:
      resources:
        limits: {cpus: "2", memory: 1g}

  worker:
    <<: *app
    command: ["python", "-m", "advisory_hub.worker"]
    # The image's HEALTHCHECK probes the web port, which the worker doesn't
    # serve. Check what the worker actually depends on instead.
    healthcheck:
      test: ["CMD", "python", "-m", "advisory_hub.cli", "check"]
      interval: 60s
      timeout: 20s
      start_period: 30s
      retries: 3
    init: true
    stop_grace_period: 60s
    # backend for Postgres/Redis; egress for NVD, VirusTotal and inventory APIs.
    networks: [backend, egress]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    deploy:
      resources:
        limits: {cpus: "2", memory: 2g}

  # One-shot: applies migrations, then exits. app and worker wait for it.
  migrate:
    <<: *app
    command: ["alembic", "upgrade", "head"]
    healthcheck: {disable: true}
    networks: [backend]
    depends_on:
      postgres: {condition: service_healthy}
    restart: "no"

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: advisory_hub
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: advisory_hub
    volumes:
      - pgdata:/var/lib/postgresql/data
    shm_size: 256m
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U advisory_hub -d advisory_hub"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits: {cpus: "2", memory: 2g}
    <<: [*hardening, *logging]
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    # Job queue, not a cache: never evict, persist to disk.
    command: ["redis-server", "--save", "60", "1", "--appendonly", "yes", "--maxmemory-policy", "noeviction", "--loglevel", "warning"]
    volumes:
      - redisdata:/data
    networks: [backend]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits: {cpus: "1", memory: 512m}
    <<: [*hardening, *logging]
    restart: unless-stopped

networks:
  # Proxy ↔ app. Not internal: app also needs outbound for VirusTotal checks
  # and inventory "Test connection", which run in the request.
  edge:
  # Postgres/Redis and their clients. internal: no route to the outside.
  backend:
    internal: true
  # Worker's outbound access (NVD, VirusTotal, inventory APIs).
  egress:

volumes:
  pgdata:
  redisdata:
  blobs:
  inbox:
  processing:
  archive:
  failed:
