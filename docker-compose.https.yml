# HTTPS overlay. Layer on top of docker-compose.yml for a TLS deployment:
#
#   docker compose -f docker-compose.yml -f docker-compose.https.yml up -d
#
# scripts/https-setup.sh writes COMPOSE_FILE into .env so plain
# `docker compose ...` picks this combination up automatically.
#
# Adds an nginx container that terminates TLS and proxies to `app`, and
# stops publishing `app`'s plain-HTTP port on the host — with this overlay
# the only way in is through nginx. Certificates are never generated here;
# install them with scripts/https-setup.sh (docs/operations.md §7).

services:
  proxy:
    # nginx with docker/nginx/advisory-hub.conf.template baked in
    # (docker/nginx/Dockerfile), published by CI next to the app image.
    image: ${IMAGE_NAMESPACE:-localhost}/advisory-hub-proxy:${IMAGE_TAG:-latest}
    environment:
      SERVER_NAME: ${SERVER_NAME:?SERVER_NAME must be set — run scripts/https-setup.sh}
      HSTS_MAX_AGE: ${HSTS_MAX_AGE:-31536000}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ${TLS_CERT_DIR:-./certs}:/etc/nginx/certs:ro
    depends_on:
      app: {condition: service_started}
    restart: unless-stopped

  app:
    # No direct host port: plain HTTP is reachable only from the proxy.
    ports: !reset []
    environment:
      SESSION_COOKIE_SECURE: "true"
      # uvicorn honours X-Forwarded-Proto/-For only from these peers. "*" is
      # safe here solely because app's port is no longer published — the
      # only thing that can reach it is inside the compose network.
      FORWARDED_ALLOW_IPS: "*"
